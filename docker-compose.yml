# Opsional. Menjalankan PostgreSQL dan aplikasi (API Go + frontend Svelte yang sudah di-build) dengan satu perintah:
#   docker compose up --build
# Lalu buka http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sohopos
      POSTGRES_USER: sohopos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sohopos -d sohopos"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Tidak ada port yang dibuka: hanya container aplikasi yang bisa menjangkau database.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://sohopos:${POSTGRES_PASSWORD}@db:5432/sohopos?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      REPORT_TZ: ${REPORT_TZ:-UTC}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
